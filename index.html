<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <h1 id="title">Weather App</h1>

        <section id="search-section">

            <form id="weather-form">

                <input
                    type="text"
                    id="city-input"
                    placeholder="Digite uma cidade"
                    autocomplete="off"
                >

                <button type="submit" id="search-btn">
                    BUSCAR
                </button>

            </form>

        </section>

        <section id="weather-card">

            <div id="location">
                <h2 id="city-name">--</h2>
                <span id="country">--</span>
            </div>

            <div id="temperature">
                <span id="temperature-value">--</span>
                <span>°C</span>
            </div>

            <div id="weather-info">

                <div class="info">
                    <span class="label">Máxima</span>
                    <span id="max-temperature">--</span>
                </div>

                <div class="info">
                    <span class="label">Mínima</span>
                    <span id="min-temperature">--</span>
                </div>

                <div class="info">
                    <span class="label">Vento</span>
                    <span id="wind-speed">--</span>
                </div>

            </div>

        </section>

        <p id="message"></p>

    </main>

    <footer>
        <p>Weather App</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
